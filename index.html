```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITY HEIST: DERB CHAOS 🔥</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#020207;
font-family:'Orbitron',sans-serif;
}

canvas{
display:block;
background:
radial-gradient(circle at center,#111 0%,#050505 70%);
}

#ui{
position:absolute;
top:15px;
left:15px;
z-index:10;
color:white;
font-size:18px;
text-shadow:0 0 10px cyan;
}

#warning{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
font-weight:900;
color:red;
display:none;
z-index:15;
text-shadow:0 0 30px red;
animation:pulse .5s infinite;
}

@keyframes pulse{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.1);}
100%{transform:translate(-50%,-50%) scale(1);}
}

#start{
position:absolute;
inset:0;
background:#000d;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:20;
color:white;
}

#start h1{
font-size:60px;
color:#0ff;
text-shadow:0 0 30px cyan;
margin-bottom:20px;
}

#start button{
padding:15px 40px;
font-size:24px;
border:none;
background:#0ff;
color:black;
cursor:pointer;
font-weight:bold;
border-radius:20px;
box-shadow:0 0 30px cyan;
transition:.2s;
}

#start button:hover{
transform:scale(1.1);
}
</style>
</head>

<body>

<div id="ui">
💰 GOLD: <span id="gold">0</span><br>
❤️ HP: <span id="hp">3</span><br>
🚔 STATUS:
<span id="status" style="color:#0f0;">STEALTH</span>
</div>

<div id="warning">RUNNNNN 🚨</div>

<div id="start">
<h1>DERB CHAOS</h1>
<button onclick="startGame()">PLAY 🔥</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let w=innerWidth;
let h=innerHeight;

canvas.width=w;
canvas.height=h;

let gameStarted=false;
let score=0;
let hp=3;
let gameOver=false;
let chase=false;

const player={
x:w/2,
y:h/2,
size:15,
speed:5,
dash:0,
trail:[]
};

let keys={};

let police=[];
let golds=[];
let particles=[];

function startGame(){
document.getElementById("start").style.display="none";
gameStarted=true;

for(let i=0;i<15;i++)spawnGold();
for(let i=0;i<4;i++)spawnPolice();

loop();
}

function spawnGold(){
golds.push({
x:Math.random()*w,
y:Math.random()*h,
size:8
});
}

function spawnPolice(){
police.push({
x:Math.random()*w,
y:Math.random()*h,
vx:(Math.random()-.5)*3,
vy:(Math.random()-.5)*3,
range:180
});
}

function explode(x,y,color){
for(let i=0;i<20;i++){
particles.push({
x,y,
vx:(Math.random()-.5)*8,
vy:(Math.random()-.5)*8,
life:40,
color
});
}
}

window.addEventListener("keydown",e=>{
keys[e.key]=true;

if(e.code==="Space" && player.dash<=0){
player.dash=20;

explode(player.x,player.y,"cyan");
}
});

window.addEventListener("keyup",e=>{
keys[e.key]=false;
});

function update(){

if(gameOver)return;

let spd=player.dash>0?10:5;

if(keys["z"]||keys["ArrowUp"])player.y-=spd;
if(keys["s"]||keys["ArrowDown"])player.y+=spd;
if(keys["q"]||keys["ArrowLeft"])player.x-=spd;
if(keys["d"]||keys["ArrowRight"])player.x+=spd;

player.dash--;

player.trail.push({
x:player.x,
y:player.y,
a:1
});

if(player.trail.length>15){
player.trail.shift();
}

chase=false;

police.forEach(p=>{

let dx=player.x-p.x;
let dy=player.y-p.y;
let dist=Math.hypot(dx,dy);

if(dist<p.range){

chase=true;

p.vx+=dx/dist*.08;
p.vy+=dy/dist*.08;

}else{

p.vx*=0.99;
p.vy*=0.99;

}

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>w)p.vx*=-1;
if(p.y<0||p.y>h)p.vy*=-1;

if(dist<25){

hp--;

explode(player.x,player.y,"red");

player.x=w/2;
player.y=h/2;

if(hp<=0){
gameOver=true;
}

}

});

golds.forEach((g,i)=>{

if(Math.hypot(player.x-g.x,player.y-g.y)<20){

score+=100;

document.getElementById("gold").innerText=score;

explode(g.x,g.y,"gold");

golds.splice(i,1);

spawnGold();

if(score%1000===0){
spawnPolice();
}

}

});

particles.forEach((p,i)=>{

p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<=0){
particles.splice(i,1);
}

});

document.getElementById("hp").innerText=hp;

document.getElementById("status").innerText=
chase?"WANTED 🚨":"STEALTH 🤫";

document.getElementById("status").style.color=
chase?"red":"lime";

document.getElementById("warning").style.display=
chase?"block":"none";
}

function draw(){

ctx.fillStyle="rgba(0,0,0,.25)";
ctx.fillRect(0,0,w,h);

for(let i=0;i<100;i++){

ctx.fillStyle="rgba(255,255,255,.03)";
ctx.fillRect(
Math.random()*w,
Math.random()*h,
2,2
);

}

golds.forEach(g=>{

ctx.shadowBlur=20;
ctx.shadowColor="gold";

ctx.fillStyle="gold";

ctx.beginPath();
ctx.arc(g.x,g.y,g.size,0,Math.PI*2);
ctx.fill();

});

police.forEach(p=>{

let grad=ctx.createRadialGradient(
p.x,p.y,10,
p.x,p.y,p.range
);

grad.addColorStop(0,"rgba(255,0,0,.3)");
grad.addColorStop(1,"transparent");

ctx.fillStyle=grad;

ctx.beginPath();
ctx.arc(p.x,p.y,p.range,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=20;
ctx.shadowColor="red";

ctx.fillStyle="#fff";

ctx.fillRect(p.x-12,p.y-12,24,24);

});

player.trail.forEach(t=>{

ctx.globalAlpha=t.a;

ctx.fillStyle="#0ff";

ctx.beginPath();
ctx.arc(t.x,t.y,8,0,Math.PI*2);
ctx.fill();

t.a-=0.07;

});

ctx.globalAlpha=1;

ctx.shadowBlur=25;
ctx.shadowColor="#0ff";

ctx.fillStyle="#fff";

ctx.beginPath();
ctx.arc(player.x,player.y,14,0,Math.PI*2);
ctx.fill();

particles.forEach(p=>{

ctx.globalAlpha=p.life/40;

ctx.fillStyle=p.color;

ctx.beginPath();
ctx.arc(p.x,p.y,4,0,Math.PI*2);
ctx.fill();

});

ctx.globalAlpha=1;

if(gameOver){

ctx.fillStyle="rgba(0,0,0,.8)";
ctx.fillRect(0,0,w,h);

ctx.fillStyle="red";
ctx.font="bold 70px Orbitron";
ctx.textAlign="center";

ctx.fillText("TCHEDDITI 🚔",w/2,h/2);

ctx.fillStyle="white";
ctx.font="30px Orbitron";

ctx.fillText(
"GOLD: "+score,
w/2,
h/2+70
);

ctx.fillText(
"REFRESH TO PLAY AGAIN",
w/2,
h/2+120
);

}

}

function loop(){

update();
draw();

requestAnimationFrame(loop);

}
</script>

</body>
</html>
