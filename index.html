<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERB CHAOS 🔥</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#000;
font-family:'Orbitron',sans-serif;
}

canvas{
display:block;
background:
radial-gradient(circle at center,#111 0%,#020207 70%);
filter:
contrast(1.2)
saturate(1.5)
brightness(1.1);
}

#ui{
position:absolute;
top:15px;
left:15px;
z-index:10;
color:white;
font-size:18px;
text-shadow:0 0 10px cyan;
line-height:1.7;
}

#warning{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
font-weight:900;
color:red;
display:none;
z-index:15;
text-shadow:0 0 30px red;
animation:pulse .5s infinite;
}

@keyframes pulse{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.1);}
100%{transform:translate(-50%,-50%) scale(1);}
}

#start{
position:absolute;
inset:0;
background:#000d;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:20;
color:white;
backdrop-filter:blur(5px);
}

#start h1{
font-size:70px;
color:#0ff;
text-shadow:0 0 40px cyan;
margin-bottom:20px;
}

#start p{
font-size:20px;
margin-bottom:30px;
color:#aaa;
}

#start button{
padding:18px 45px;
font-size:24px;
border:none;
background:#0ff;
color:black;
cursor:pointer;
font-weight:bold;
border-radius:20px;
box-shadow:0 0 30px cyan;
transition:.2s;
}

#start button:hover{
transform:scale(1.1);
}

#mission{
position:absolute;
top:20px;
right:20px;
background:#000a;
padding:15px;
border:2px solid #0ff;
border-radius:15px;
color:white;
z-index:10;
box-shadow:0 0 20px cyan;
}

#mission h3{
color:#0ff;
margin-bottom:10px;
}
</style>
</head>

<body>

<div id="ui">
💰 GOLD: <span id="gold">0</span><br>
❤️ HP: <span id="hp">3</span><br>
🚔 STATUS:
<span id="status" style="color:#0f0;">STEALTH</span>
</div>

<div id="mission">
<h3>MISSION</h3>
<p>Collect 5000 GOLD 💰</p>
</div>

<div id="warning">RUNNN 🚨</div>

<div id="start">
<h1>DERB CHAOS</h1>
<p>Escape the police and dominate the city 🔥</p>
<button onclick="startGame()">PLAY 🔥</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let w=innerWidth;
let h=innerHeight;

canvas.width=w;
canvas.height=h;

let score=0;
let hp=3;
let gameOver=false;
let chase=false;

const player={
x:w/2,
y:h/2,
speed:5,
dash:0,
trail:[]
};

let keys={};

let police=[];
let golds=[];
let particles=[];
let cars=[];

function startGame(){

document.getElementById("start").style.display="none";

for(let i=0;i<15;i++)spawnGold();

for(let i=0;i<5;i++)spawnPolice();

for(let i=0;i<6;i++)spawnCar();

loop();

}

function spawnGold(){

golds.push({
x:Math.random()*w,
y:Math.random()*(h-160),
size:8
});

}

function spawnPolice(){

police.push({
x:Math.random()*w,
y:Math.random()*h,
vx:(Math.random()-.5)*3,
vy:(Math.random()-.5)*3,
range:180
});

}

function spawnCar(){

cars.push({
x:Math.random()*w,
y:h-100+Math.random()*60,
speed:4+Math.random()*5,
color:`hsl(${Math.random()*360},100%,50%)`
});

}

function explode(x,y,color){

for(let i=0;i<25;i++){

particles.push({
x,y,
vx:(Math.random()-.5)*10,
vy:(Math.random()-.5)*10,
life:40,
color
});

}

}

window.addEventListener("keydown",e=>{

keys[e.key]=true;

if(e.code==="Space"&&player.dash<=0){

player.dash=20;

explode(player.x,player.y,"cyan");

}

});

window.addEventListener("keyup",e=>{

keys[e.key]=false;

});

function update(){

if(gameOver)return;

let spd=player.dash>0?10:5;

if(keys["z"]||keys["ArrowUp"])player.y-=spd;
if(keys["s"]||keys["ArrowDown"])player.y+=spd;
if(keys["q"]||keys["ArrowLeft"])player.x-=spd;
if(keys["d"]||keys["ArrowRight"])player.x+=spd;

player.dash--;

player.trail.push({
x:player.x,
y:player.y,
a:1
});

if(player.trail.length>15){
player.trail.shift();
}

cars.forEach(c=>{

c.x+=c.speed;

if(c.x>w+100){
c.x=-100;
}

if(
player.x>c.x-40&&
player.x<c.x+40&&
player.y>c.y-20&&
player.y<c.y+20
){

hp--;

explode(player.x,player.y,"orange");

player.x=w/2;
player.y=h/2;

}

});

chase=false;

police.forEach(p=>{

let dx=player.x-p.x;
let dy=player.y-p.y;

let dist=Math.hypot(dx,dy);

if(dist<p.range){

chase=true;

p.vx+=dx/dist*.08;
p.vy+=dy/dist*.08;

}else{

p.vx*=0.99;
p.vy*=0.99;

}

p.x+=p.vx;
p.y+=p.vy;

if(dist<30){

hp--;

explode(player.x,player.y,"red");

player.x=w/2;
player.y=h/2;

if(hp<=0){
gameOver=true;
}

}

});

golds.forEach((g,i)=>{

if(Math.hypot(player.x-g.x,player.y-g.y)<25){

score+=100;

document.getElementById("gold").innerText=score;

explode(g.x,g.y,"gold");

golds.splice(i,1);

spawnGold();

if(score%1000===0){
spawnPolice();
}

if(score>=5000){
document.getElementById("mission").innerHTML=
"<h2 style='color:lime'>MISSION COMPLETE ✅</h2>";
}

}

});

particles.forEach((p,i)=>{

p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<=0){

particles.splice(i,1);

}

});

document.getElementById("hp").innerText=hp;

document.getElementById("status").innerText=
chase?"WANTED 🚨":"STEALTH 🤫";

document.getElementById("status").style.color=
chase?"red":"lime";

document.getElementById("warning").style.display=
chase?"block":"none";

if(hp<=0){
gameOver=true;
}

}

function drawCity(){

for(let i=0;i<40;i++){

let bx=i*120;

let bh=(Math.sin(i)*100)+220;

ctx.fillStyle="#111";

ctx.fillRect(
bx,
h-bh,
80,
bh
);

ctx.fillStyle="#0ff";

for(let y=h-bh+20;y<h-20;y+=25){

ctx.fillRect(bx+15,y,10,10);
ctx.fillRect(bx+45,y,10,10);

}

}

}

function drawRoad(){

ctx.fillStyle="#222";
ctx.fillRect(0,h-140,w,140);

ctx.strokeStyle="white";
ctx.lineWidth=4;

for(let i=0;i<w;i+=60){

ctx.beginPath();
ctx.moveTo(i,h-70);
ctx.lineTo(i+30,h-70);
ctx.stroke();

}

}

function draw(){

ctx.fillStyle="rgba(0,0,0,.25)";
ctx.fillRect(0,0,w,h);

drawCity();

drawRoad();

for(let i=0;i<100;i++){

ctx.fillStyle="rgba(255,255,255,.05)";
ctx.fillRect(
Math.random()*w,
Math.random()*h,
2,2
);

}

cars.forEach(c=>{

ctx.shadowBlur=20;
ctx.shadowColor=c.color;

ctx.fillStyle=c.color;

ctx.fillRect(c.x,c.y,60,25);

ctx.fillStyle="#fff";
ctx.fillRect(c.x+10,c.y-8,40,10);

});

golds.forEach(g=>{

ctx.shadowBlur=20;
ctx.shadowColor="gold";

ctx.fillStyle="gold";

ctx.beginPath();
ctx.arc(g.x,g.y,g.size,0,Math.PI*2);
ctx.fill();

});

police.forEach(p=>{

let grad=ctx.createRadialGradient(
p.x,p.y,10,
p.x,p.y,p.range
);

grad.addColorStop(0,"rgba(255,0,0,.3)");
grad.addColorStop(1,"transparent");

ctx.fillStyle=grad;

ctx.beginPath();
ctx.arc(p.x,p.y,p.range,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=20;
ctx.shadowColor="red";

ctx.fillStyle="#fff";
ctx.fillRect(p.x-12,p.y-12,24,24);

ctx.fillStyle="red";
ctx.fillRect(p.x-12,p.y-18,24,6);

});

player.trail.forEach(t=>{

ctx.globalAlpha=t.a;

ctx.fillStyle="#0ff";

ctx.beginPath();
ctx.arc(t.x,t.y,10,0,Math.PI*2);
ctx.fill();

t.a-=0.07;

});

ctx.globalAlpha=1;

ctx.shadowBlur=25;
ctx.shadowColor="#0ff";

// BODY
ctx.fillStyle="#00e5ff";
ctx.fillRect(player.x-10,player.y-15,20,30);

// HEAD
ctx.fillStyle="#ffe0bd";
ctx.beginPath();
ctx.arc(player.x,player.y-22,8,0,Math.PI*2);
ctx.fill();

// EYES
ctx.fillStyle="#000";
ctx.fillRect(player.x-4,player.y-24,2,2);
ctx.fillRect(player.x+2,player.y-24,2,2);

// GUN
ctx.fillStyle="black";
ctx.fillRect(player.x+10,player.y-8,12,4);

particles.forEach(p=>{

ctx.globalAlpha=p.life/40;

ctx.fillStyle=p.color;

ctx.beginPath();
ctx.arc(p.x,p.y,4,0,Math.PI*2);
ctx.fill();

});

ctx.globalAlpha=1;

if(gameOver){

ctx.fillStyle="rgba(0,0,0,.85)";
ctx.fillRect(0,0,w,h);

ctx.fillStyle="red";
ctx.font="bold 70px Orbitron";
ctx.textAlign="center";

ctx.fillText(
"TCHEDDITI 🚔",
w/2,
h/2
);

ctx.fillStyle="white";
ctx.font="30px Orbitron";

ctx.fillText(
"GOLD: "+score,
w/2,
h/2+70
);

ctx.fillText(
"REFRESH TO PLAY AGAIN",
w/2,
h/2+120
);

}

}

function loop(){

update();
draw();

requestAnimationFrame(loop);

}

window.addEventListener("resize",()=>{

w=innerWidth;
h=innerHeight;

canvas.width=w;
canvas.height=h;

});
</script>

</body>
</html>
