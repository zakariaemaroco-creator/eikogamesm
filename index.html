<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITY HEIST: CHFAR VS BOLIS ⚡</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap');
    
    body { margin: 0; background: #020205; font-family: 'Orbitron', sans-serif; overflow: hidden; color: white; }

    #ui {
        position: absolute; top: 20px; left: 20px; font-size: 20px;
        text-shadow: 0 0 10px #ffea00; z-index: 5; pointer-events: none;
    }

    #msg {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-size: 40px; font-weight: 800; text-align: center;
        text-shadow: 0 0 20px #f00; display: none; z-index: 10;
    }

    .status { color: #0ff; font-size: 14px; margin-top: 5px; }
    canvas { display: block; filter: contrast(1.2) brightness(1.1); }
</style>
</head>
<body>

<div id="ui">
    GOLD: <span id="gold">0</span> <br>
    <div class="status">STATUS: <span id="st-text" style="color: #0f0;">STEALTH</span></div>
</div>

<div id="msg">POLICE SPOTTED! 🚨<br><span style="font-size: 20px;">RUNNNN!</span></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let w = innerWidth, h = innerHeight;
canvas.width = w; canvas.height = h;

let goldCount = 0;
let frames = 0;
let isChased = false;
let gameOver = false;

// Player (Chfar)
const player = {
    x: w/2, y: h/2, size: 15, speed: 5, color: "#fff",
    trail: []
};

// Entities
let policeCars = [];
let golds = [];
let particles = [];

// Moroccan Slang for excitement
const slang = ["NADI!", "HARBAN!", "WA3ER!", "SDAAA3!", "skit skit! 🤫"];

function init() {
    // Spawn initial Gold
    for(let i=0; i<10; i++) spawnGold();
    // Spawn Police
    for(let i=0; i<3; i++) spawnPolice();
}

function spawnGold() {
    golds.push({ x: Math.random()*(w-40)+20, y: Math.random()*(h-40)+20, size: 8 });
}

function spawnPolice() {
    policeCars.push({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
        angle: Math.random()*Math.PI*2,
        lightRange: 150,
        rotating: Math.random() > 0.5
    });
}

function update() {
    if(gameOver) return;

    // Smooth Follow Mouse
    let dx = mouse.x - player.x;
    let dy = mouse.y - player.y;
    let dist = Math.hypot(dx, dy);
    if(dist > 5) {
        player.x += (dx/dist) * player.speed;
        player.y += (dy/dist) * player.speed;
    }

    // Trail logic
    player.trail.push({x: player.x, y: player.y, alpha: 1});
    if(player.trail.length > 10) player.trail.shift();

    // Police Logic
    isChased = false;
    policeCars.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > w) p.vx *= -1;
        if(p.y < 0 || p.y > h) p.vy *= -1;

        // Detection Cone (The Light)
        let pdx = player.x - p.x;
        let pdy = player.y - p.y;
        let pdist = Math.hypot(pdx, pdy);

        if(pdist < p.lightRange) {
            isChased = true;
            // Police follow player if spotted
            p.vx += (pdx/pdist) * 0.1;
            p.vy += (pdy/pdist) * 0.1;
            player.speed = 7; // Panic speed
        } else {
            player.speed = 5;
        }

        // Catch logic
        if(pdist < 25) gameOver = true;
    });

    // UI Updates
    document.getElementById("st-text").innerText = isChased ? "WANTED! 🚨" : "STEALTH 🤫";
    document.getElementById("st-text").style.color = isChased ? "#f00" : "#0f0";
    document.getElementById("msg").style.display = isChased ? "block" : "none";

    // Gold Collection
    golds.forEach((g, i) => {
        if(Math.hypot(player.x - g.x, player.y - g.y) < 25) {
            golds.splice(i, 1);
            goldCount += 200;
            document.getElementById("gold").innerText = goldCount;
            spawnGold();
            if(goldCount % 1000 === 0) spawnPolice(); // More gold = More Bolis
        }
    });
}

function draw() {
    // Dark City Background
    ctx.fillStyle = "rgba(2, 2, 10, 0.2)";
    ctx.fillRect(0, 0, w, h);

    // Draw Gold
    golds.forEach(g => {
        ctx.shadowBlur = 15; ctx.shadowColor = "#ffea00";
        ctx.fillStyle = "#ffea00";
        ctx.beginPath(); ctx.arc(g.x, g.y, g.size, 0, Math.PI*2); ctx.fill();
    });

    // Draw Police & Searchlights
    policeCars.forEach(p => {
        // Searchlight Glow
        let grad = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.lightRange);
        grad.addColorStop(0, isChased ? "rgba(255, 0, 0, 0.4)" : "rgba(0, 255, 255, 0.2)");
        grad.addColorStop(1, "transparent");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.lightRange, 0, Math.PI*2); ctx.fill();

        // Police Car Body
        ctx.shadowBlur = 10; ctx.shadowColor = (frames % 10 < 5) ? "#f00" : "#00f";
        ctx.fillStyle = "#fff";
        ctx.fillRect(p.x-10, p.y-10, 20, 20);
    });

    // Draw Player (The Chfar)
    player.trail.forEach(t => {
        ctx.globalAlpha = t.alpha;
        ctx.fillStyle = "#0ff";
        ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2); ctx.fill();
        t.alpha -= 0.1;
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 15; ctx.shadowColor = "#0ff";
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(player.x, player.y, 12, 0, Math.PI*2); ctx.fill();

    if(gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#f00"; ctx.font = "bold 50px Orbitron"; ctx.textAlign = "center";
        ctx.fillText("TCHEDDITI! 🚔", w/2, h/2);
        ctx.font = "20px Orbitron"; ctx.fillStyle = "#fff";
        ctx.fillText("Final Gold: " + goldCount, w/2, h/2 + 50);
        ctx.fillText("Click to Try Again", w/2, h/2 + 90);
    }
}

let mouse = { x: w/2, y: h/2 };
window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener("touchmove", e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
window.addEventListener("mousedown", () => { if(gameOver) location.reload(); });

function loop() {
    frames++;
    update();
    draw();
    requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
